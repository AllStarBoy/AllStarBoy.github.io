<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PawVoyage | Pet Travel Products</title>
	<link rel="icon" type="image/png" href="logo.png">
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #fff; background: linear-gradient(135deg, #17152f, #35206b 55%, #0c8b83); }
		main { width: min(620px, 100%); padding: 56px 32px; text-align: center; border: 1px solid rgba(255,255,255,.2); border-radius: 24px; background: rgba(10,10,25,.35); box-shadow: 0 24px 80px rgba(0,0,0,.25); backdrop-filter: blur(12px); }
		.logo { display: block; width: 132px; height: 132px; margin: 0 auto 28px; border-radius: 50%; object-fit: contain; }
		p { color: #d7d5e4; line-height: 1.6; }
		.eyebrow { color: #a7ffe9; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 12px 0; font-size: clamp(42px, 9vw, 76px); line-height: .98; letter-spacing: -.06em; }
		.description { max-width: 470px; margin: 20px auto 30px; font-size: 17px; }
		form { display: flex; gap: 8px; max-width: 480px; margin: auto; padding: 6px; border-radius: 13px; background: rgba(255,255,255,.12); }
		input, button { border: 0; border-radius: 9px; padding: 14px 16px; font: inherit; }
		input { min-width: 0; flex: 1; color: #fff; outline: none; background: transparent; }
		input::placeholder { color: #bbb8c9; }
		button { color: #111326; font-weight: 700; cursor: pointer; background: #a7ffe9; }
		button:hover { background: #fff; }
		#message { min-height: 24px; margin: 14px 0 0; color: #a7ffe9; font-size: 14px; }
		small { color: #aaa7b9; }
		@media (max-width: 520px) { main { padding: 42px 20px; } form { flex-direction: column; background: transparent; } input, button { width: 100%; background: rgba(255,255,255,.12); } button { color: #111326; background: #a7ffe9; } }
	</style>
</head>
<body>
	<main>
		<img class="logo" src="logo.png" alt="PawVoyage logo">
		<div class="eyebrow">Pet travel products, coming soon</div>
		<h1>Travel Better. Wag Happier.</h1>
		<p class="description">PawVoyage is bringing practical, comfortable, and adventure-ready products to pets and the people who travel with them. Join the list for first access to our launch.</p>
		<form id="waitlist">
			<label for="email" hidden>Email address</label>
			<input id="email" type="email" placeholder="Enter your email address" required>
			<button type="submit">Get launch access</button>
		</form>
		<p id="message" role="status"></p>
		<small>New pet travel finds, launch updates, and special offers.</small>
	</main>
	<script>
		document.querySelector('#waitlist').addEventListener('submit', function (event) {
			event.preventDefault();
			document.querySelector('#message').textContent = 'Thanks! You’re on the list.';
			this.reset();
		});
	</script>
</body>
</html>
